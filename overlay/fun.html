<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Angel Fun Commands</title>

    <script src="/socket.io/socket.io.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;

            overflow: hidden;

            background: transparent;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }


        #container {
            width: 100%;
            height: 100%;

            display: flex;
            justify-content: center;
            align-items: center;

            pointer-events: none;
        }


        #alert {
            min-width: 420px;
            max-width: 850px;

            padding: 30px 45px;

            text-align: center;

            border-radius: 30px;

            background:
                rgba(255, 220, 240, 0.95);

            border:
                4px solid white;

            box-shadow:
                0 0 20px rgba(255, 255, 255, 0.9),
                0 0 40px rgba(255, 150, 210, 0.8);

            opacity: 0;
            transform:
                translateY(50px)
                scale(0.7);

            transition:
                opacity 0.35s ease,
                transform 0.35s ease;
        }


        #alert.show {
            opacity: 1;

            transform:
                translateY(0)
                scale(1);
        }


        #username {
            font-size: 42px;
            font-weight: bold;

            margin-bottom: 12px;

            text-shadow:
                -2px -2px 0 white,
                2px -2px 0 white,
                -2px 2px 0 white,
                2px 2px 0 white;
        }


        #result {
            font-size: 64px;
            font-weight: 900;

            margin-bottom: 8px;

            text-shadow:
                -3px -3px 0 white,
                3px -3px 0 white,
                -3px 3px 0 white,
                3px 3px 0 white;
        }


        #subtitle {
            font-size: 28px;
            font-weight: bold;
        }


        #emoji {
            font-size: 55px;

            margin-bottom: 10px;
        }

    </style>
</head>


<body>

    <div id="container">

        <div id="alert">

            <div id="emoji"></div>

            <div id="username"></div>

            <div id="result"></div>

            <div id="subtitle"></div>

        </div>

    </div>


    <script>

        const params =
            new URLSearchParams(
                window.location.search
            );

        const channel =
            (
                params.get("channel") || ""
            )
                .replace("#", "")
                .toLowerCase();


        const socket = io({
            query: {
                channel: channel
            }
        });


        const alertBox =
            document.getElementById("alert");

        const usernameElement =
            document.getElementById("username");

        const resultElement =
            document.getElementById("result");

        const subtitleElement =
            document.getElementById("subtitle");

        const emojiElement =
            document.getElementById("emoji");


        let hideTimer = null;


        socket.on(
            "funCommand",
            data => {

                if (hideTimer) {
                    clearTimeout(hideTimer);
                }


                usernameElement.textContent =
                    `@${data.username}`;


                if (data.command === "inches") {

                    emojiElement.textContent =
                        "📏";

                    resultElement.textContent =
                        `${data.result} INCHES`;

                    subtitleElement.textContent =
                        "The measurements are in 😳";
                }


                else if (data.command === "girth") {

                    emojiElement.textContent =
                        "⭕";

                    resultElement.textContent =
                        `${data.result} INCHES`;

                    subtitleElement.textContent =
                        "An absolutely scientific result 💀";
                }


                else if (data.command === "cup") {

                    emojiElement.textContent =
                        "🎀";

                    resultElement.textContent =
                        `${data.result} CUP`;

                    subtitleElement.textContent =
                        "The calculator has spoken ✨";
                }


                alertBox.classList.remove("show");

                void alertBox.offsetWidth;

                alertBox.classList.add("show");


                hideTimer = setTimeout(
                    () => {

                        alertBox.classList.remove(
                            "show"
                        );

                    },
                    5000
                );
            }
        );

    </script>

</body>

</html>
